# Configure a fresh host with a new key:
#   Generate the host's SSH key: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
#   Generate an age key from the SSH key: nix run github:Mic92/ssh-to-age -- -private-key -i ~/.ssh/id_ed25519 -o ~/.ssh/key.txt
#   Get the pubkey from that age key: age-keygen -y ~/.ssh/key.txt
#
# Once a host has an age pubkey, add it to the keys array here.
# Finally, re-encrypt any relevant secrets files: sops updatekeys path/to/file.secrets.env
#
# USEFUL COMMANDS:
# List all files to which sops rules apply:
#   find . -regextype posix-extended -regex '.*/[^/]*(\.(secrets|token|passwd)|secrets\.env|config\.boot)[^/]*'
